{%- comment -%}
  The <head> tags every page shares. Give it title= and description=.
{%- endcomment -%}
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ include.title | escape }}</title>
  <meta name="description" content="{{ include.description | escape }}">
  <link rel="canonical" href="{{ site.url }}{{ page.url }}">
  <link rel="alternate" hreflang="en-GB" href="{{ site.url }}{{ alt_en }}">
  <link rel="alternate" hreflang="cy" href="{{ site.url }}{{ alt_cy }}">
  <link rel="alternate" hreflang="x-default" href="{{ site.url }}{{ alt_en }}">
  <meta name="theme-color" content="#161412">

  <meta property="og:type" content="website">
  <meta property="og:locale" content="{{ t.og_locale }}">
  <meta property="og:site_name" content="{{ band.name | escape }}">
  <meta property="og:title" content="{{ include.og_title | default: include.title | escape }}">
  <meta property="og:description" content="{{ include.description | escape }}">
  <meta property="og:url" content="{{ site.url }}{{ page.url }}">
  <meta property="og:image" content="{{ site.url }}/images/share.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="{{ cover_alt | escape }}">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="{{ '/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..100,400..900&display=swap">
  <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">

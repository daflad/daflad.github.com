# Gigs, past and future. Add one block per gig, in any order. The site sorts them by date.
# Future gigs are listed under "Gigs". Once a gig's date has passed it moves to
# "Past gigs" by itself.
#
# Copy the block below, remove the # from each line, and fill it in.
# Only date and venue are required. Add the town too for future gigs, so the
# Directions button finds the right place.
#
# For the Welsh page (hotdaw.gs/cy/) you can add venue_cy, town_cy and notes_cy.
# Without them the Welsh page shows the English.
#
# - date: 2026-12-06              # year-month-day
#   venue: The Belle Vue
#   town: Bangor
#   time: 9pm                     # write it as 9pm, 8:30pm or 21:00
#   price: Free entry             # or "£5 on the door", etc.
#   link: https://...             # Facebook event, tickets or venue page
#   link_text: Tickets            # button label for the link, default "Event page"
#   notes: Support from ...       # one short line
#   notes_cy: Yn cefnogi ...      # the notes in Welsh, for the Welsh page (optional)
#   flyer: WinterFolk_2023.jpg    # optional: the gig's flyer or poster, in the images folder
#   recording: Winterwell_Launch_2026.mp3   # optional: an MP3 in the audio folder, played on the
#                                 # past gigs page (keep it around 128 kbps; see tools/README.md)
#   photos:                       # optional, for past gigs: photos in the images folder,
#     - Skerries.jpg              # shown as small pictures you can tap to see full size
#   photos_by: Gavin Mart         # optional: who took the photos, credited under them


